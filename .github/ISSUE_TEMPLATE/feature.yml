name: Feature Request
description: Propose a focused improvement to Cippus.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an improvement. Describe the problem first; a solution is welcome but not required.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What is difficult, missing, or inconsistent today? Who is affected?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should a successful result let a package user do?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Share an implementation idea, API, or example if you have one.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other approaches have you considered?
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to help implement this if the approach is accepted.
          required: false
